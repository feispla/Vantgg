<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #050507;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050507;
      }
      .bg {
        position: absolute;
        inset: 0;
        background:
          url("./og-bg.jpg") center / cover no-repeat;
        filter: saturate(1.05) contrast(1.05);
      }
      .veil {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 52% 62% at 50% 44%, rgba(5, 5, 7, 0.18) 0%, rgba(5, 5, 7, 0.42) 58%, rgba(5, 5, 7, 0.78) 100%);
      }
      .grid {
        position: absolute;
        inset: 0;
        opacity: 0.18;
        background-image:
          linear-gradient(rgba(249, 1, 36, 0.18) 1px, transparent 1px),
          linear-gradient(90deg, rgba(245, 245, 246, 0.06) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse 70% 80% at 50% 50%, black 20%, transparent 75%);
      }
      .lockup {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 48px 96px;
      }
      .mark {
        width: 312px;
        height: auto;
        display: block;
        filter: drop-shadow(0 0 28px rgba(249, 1, 36, 0.35));
      }
      .title {
        margin-top: 10px;
        font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
        font-weight: 700;
        font-size: 92px;
        line-height: 0.9;
        letter-spacing: 0.28em;
        color: #F5F5F6;
        text-indent: 0.28em;
        padding-right: 0.28em;
      }
      .subtitle {
        margin-top: 8px;
        font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
        font-weight: 600;
        font-size: 28px;
        line-height: 1;
        letter-spacing: 0.62em;
        color: #F5F5F6;
        text-indent: 0.62em;
        padding-right: 0.62em;
      }
      .rule {
        width: 72px;
        height: 2px;
        margin-top: 22px;
        background: #F90124;
      }
      .tag {
        margin-top: 14px;
        font-family: "DM Mono", ui-monospace, monospace;
        font-weight: 500;
        font-size: 13px;
        letter-spacing: 0.46em;
        color: #F90124;
        text-indent: 0.46em;
        padding-right: 0.46em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bg"></div>
      <div class="veil"></div>
      <div class="grid"></div>
      <div class="lockup">
        <img class="mark" src="./og-logo.png" alt="" />
        <div class="title">VANT</div>
        <div class="subtitle">REALM</div>
        <div class="rule"></div>
        <div class="tag">RANKED ESPORTS</div>
      </div>
    </div>
  </body>
</html>
